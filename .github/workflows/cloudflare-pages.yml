name: cloudflare-pages

# 手动触发：在仓库 Secrets 配置好 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 后，
# 到 Actions 页点 "Run workflow"。没有 secrets 前不会自动运行，不会出现红灯。
#
# 后端（FastAPI）不适合 Cloudflare Workers（Python 支持为 beta，uvicorn 监听模型、
# bcrypt/SQLAlchemy 轮子与 SQLite 持久化都不适配）——后端复活方案见 docs/DEPLOY-CLOUDFLARE.md。
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 落地页：纯静态，直接发
      - name: Deploy landing (site/) → ai-resume-landing.pages.dev
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=ai-resume-landing --commit-dirty=true

      # Web 端：构建后发（API 基址用构建时注入的环境变量）
      - name: Build web-frontend
        run: |
          npm ci
          npm run build
        working-directory: web-frontend

      - name: Deploy web (web-frontend/dist) → ai-resume-web.pages.dev
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web-frontend/dist --project-name=ai-resume-web --commit-dirty=true
