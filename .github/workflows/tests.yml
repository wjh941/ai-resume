name: tests

on:
  push:
    branches: [feature/ai-resume-demo, main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resume-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: resume-backend/requirements.txt
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # server 部署形态的 extras(与 Dockerfile 一致):测试模块顶层 import alembic
          pip install -r requirements.txt "SQLAlchemy>=2.0,<3" "alembic>=1.13,<2" pytest pytest-cov
      - name: 运行测试(覆盖率门禁 90%)
        run: pytest -q --cov=app --cov-report=term --cov-fail-under=90

  web-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  miniprogram:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resume-miniprogram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: resume-miniprogram/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
