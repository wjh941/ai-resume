# 项目主页（GitHub Pages）：site/ 目录为自包含静态站，无构建步骤。
# 前提：仓库 Settings → Pages → Source 选 "GitHub Actions"。
name: Deploy GitHub Pages

on:
  push:
    branches: [feature/ai-resume-demo]
    paths: ["site/**", ".github/workflows/deploy-github-pages.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
