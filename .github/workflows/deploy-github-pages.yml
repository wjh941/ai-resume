# 项目主页（GitHub Pages）：site/ 目录为自包含静态站。
# 附带构建小程序 H5 版并入 site/mini/，作为可在线体验的三端入口之一。
# 前提：仓库 Settings → Pages → Source 选 "GitHub Actions"。
name: Deploy GitHub Pages

on:
  push:
    branches: [feature/ai-resume-demo]
    paths:
      - "site/**"
      - "resume-miniprogram/src/**"
      - "resume-miniprogram/package.json"
      - ".github/workflows/deploy-github-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: resume-miniprogram/package-lock.json
      - name: Build mini-program H5 preview
        working-directory: resume-miniprogram
        env:
          MINI_PAGES_BASE: /ai-resume/mini/
          VITE_RESUME_API_URL: https://ai-resume-backend-1ouv.onrender.com
        run: |
          npm ci
          npm run build:h5
      - name: Merge H5 preview into site
        run: |
          rm -rf site/mini
          cp -r resume-miniprogram/dist/build/h5 site/mini
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
