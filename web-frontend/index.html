<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f8fc" />
    <title>求职成长工作台</title>
    <style>
      /* 启动壳：独立于应用 CSS。任何阶段的失败都停在浅色品牌加载页，而不是黑屏。 */
      html, body { margin: 0; background: #f6f8fc; }
      .boot-shell { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #171a24; }
      .boot-mark { width: 46px; height: 46px; border-radius: 12px; background: linear-gradient(135deg, #2563eb, #7c3aed); display: grid; place-items: center; color: #fff; font-size: 21px; font-weight: 700; }
      .boot-title { font-size: 17px; font-weight: 600; letter-spacing: 1px; }
      .boot-spinner { width: 20px; height: 20px; border-radius: 50%; border: 3px solid #d8e2f4; border-top-color: #2563eb; animation: boot-spin 0.9s linear infinite; }
      .boot-error { display: none; max-width: 86vw; padding: 12px 16px; border-radius: 10px; background: #fdf1ef; border: 1px solid #ffccc7; color: #bf3f3a; font-size: 13px; line-height: 1.6; word-break: break-all; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- THESIS: A job seeker sees their next move before their data. OWN-WORLD: forest navigation, white work canvas, coral action controls, and sky or citron evidence states. STORY: sign in, orient, and move directly into a working plan. FIRST VIEWPORT: an asymmetric sign-in scene places the product promise in a forest field and the active form on a clean white plane. FORM: Operate workspace, direction key web-job-workspace-20260821. FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md. -->
    <div id="app">
      <div class="boot-shell" id="boot-shell">
        <div class="boot-mark">启</div>
        <div class="boot-title">求职成长工作台</div>
        <div class="boot-spinner" role="status" aria-label="正在加载工作台"></div>
        <div class="boot-error" id="boot-error"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
