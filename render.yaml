# Render 蓝图：后端 FastAPI + SQLite 一键部署（免费档）。
# 使用：Render Dashboard → New → Blueprint → 选择本仓库即可；
# 或手动创建时按下表填写环境变量（AI_API_KEY / AI_BASE_URL / CORS_ORIGINS 需手动填入）。
# 注意：免费档磁盘不持久，重新部署或重启后 SQLite 数据会重置（演示用途可接受）。
services:
  - type: web
    name: ai-resume-backend
    runtime: python
    rootDir: resume-backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # 前端 Vercel 域名，如 https://ai-resume-web.vercel.app（多个用英文逗号分隔）
      - key: CORS_ORIGINS
        sync: false
      # AI 中转配置，与本地 .env 同名变量一致
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        value: gpt-5.5
