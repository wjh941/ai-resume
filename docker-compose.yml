services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_resume}
      POSTGRES_USER: ${POSTGRES_USER:-ai_resume}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./resume-backend
    restart: unless-stopped
    env_file: ./resume-backend/.env
    environment:
      PRODUCTION: "true"
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ai_resume}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_resume}
      AUTH_DEMO_MODE: "false"
      SMS_PROVIDER: disabled
      PAYMENT_DEMO_MODE: "false"
      PUSH_DISPATCHER_MODE: mock
      WEB_SEARCH_PROVIDER: disabled
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["8000"]
    volumes:
      - export_data:/app/temp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  worker:
    build: ./resume-backend
    command: ["python", "worker.py"]
    restart: unless-stopped
    env_file: ./resume-backend/.env
    environment:
      PRODUCTION: "true"
      WORKER_ENABLED: "true"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ai_resume}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_resume}
      AUTH_DEMO_MODE: "false"
      SMS_PROVIDER: disabled
      PAYMENT_DEMO_MODE: "false"
      PUSH_DISPATCHER_MODE: mock
      WEB_SEARCH_PROVIDER: disabled
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - export_data:/app/temp
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build: ./resume-miniprogram
    depends_on:
      backend:
        condition: service_healthy
    ports: ["80:80"]

volumes:
  postgres_data:
  export_data:

# HTTPS is intentionally not configured here. Put Nginx or Caddy in front of port 80.
