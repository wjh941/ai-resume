# ruff 配置 —— resume-backend 专用
#
# 为什么是独立的 ruff.toml 而不是 pyproject.toml:
#   本目录没有 pyproject.toml,依赖走 requirements.txt(Dockerfile/CI 同源),
#   因此工具配置单独落在本文件。CI 在 .github/workflows/tests.yml 的 backend job
#   (working-directory: resume-backend)里执行 `ruff check .`,会自动读取本文件。
#
# 门禁策略:从宽起步,追求"门禁建立且可守",不追求零违规。
#   - 只选 E4/E7/E9(E 的子集),刻意不含 E501 行宽检查:
#     存量代码行宽普遍超过 110,若开启将产生数百条违规,自动修复也无法安全消除,
#     只会逼团队生成 noqa 噪音,故暂不启用(后续可分批收敛后再开)。
#   - I(isort)/F(pyflakes)违规可由 `ruff check --fix` 安全消除(仅调整导入),
#     已在本仓库一次性修复,保持零违规。
#   - B(bugbear)只保留默认可修/低噪音的基础集,个别与现有写法冲突的规则见 ignore。

line-length = 110
target-version = "py311"
extend-exclude = ["migrations"] # alembic 迁移目录:历史脚本不回改,不纳入 lint

[lint]
select = [
    "E4",  # pycodestyle 导入相关
    "E7",  # pycodestyle 语句级错误(比较/赋值/裸 except 等)
    "E9",  # pycodestyle 运行时错误级(语法/未定义名)
    "F",   # pyflakes 全集(未用导入/未定义名/f-string 问题)
    "I",   # isort 导入排序
    "B",   # flake8-bugbear 常见 bug 模式
]

# B 类如果后续违规量过大,优先按规则码在 extend-select/ignore 里微调,
# 而不是整体去掉 B——保留 bugbear 才能拦住 mutable default 这类真问题。

# 放宽说明(规则级豁免,不是关闭 B008):
#   FastAPI 的依赖注入就是把 Depends/Query/File/Security 写进参数默认值,
#   这是框架规定的写法而非 bug(存量命中 38 处,全部属于此类)。
#   把这些调用登记为"不可变调用"后,B008 仍然拦得住 `def f(x=[])` 这类真问题。
#   require_vip_feature 是 FastAPI 官方推荐的"参数化依赖工厂"(余下 3 处命中均为
#   Depends(require_vip_feature("...")) 形态),与 Depends 同理豁免。
[lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.File",
    "fastapi.Security",
    "app.services.membership.require_vip_feature",
]
